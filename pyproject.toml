[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rsec-ai"
version = "0.3.0a1"
description = "Local cybersecurity and software engineering model research and MLOps"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
dependencies = ["pydantic==2.14.4", "PyYAML==6.0.4"]

[project.scripts]
rsec = "rsec.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["ml: real CPU tiny-model integration", "gpu: physical GPU required", "multigpu: two physical GPUs required", "export: external llama.cpp required"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
