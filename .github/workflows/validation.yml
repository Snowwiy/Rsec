name: Offline ML integration
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tiny-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HF_HUB_OFFLINE: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install torch==2.8.0+cpu --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements-cpu-test.lock -e .
      - run: pytest -m ml
      - run: rsec data prepare --input data/samples/defensive.jsonl --output data/processed/ci
      - run: rsec data validate data/processed/ci
      - run: python scripts/check_repository.py
