name: Security checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt -e .
      - run: pip-audit --disable-pip --no-deps -r requirements-cpu-test.lock
      - name: Build reviewed secret scanner source
        env:
          GITLEAKS_REVISION: 107a41827bb6698dbbff756b2300537774a1d84c
        run: |
          git clone https://github.com/gitleaks/gitleaks.git "$RUNNER_TEMP/gitleaks"
          git -C "$RUNNER_TEMP/gitleaks" checkout --detach "$GITLEAKS_REVISION"
          cd "$RUNNER_TEMP/gitleaks"
          go build -o "$RUNNER_TEMP/gitleaks-bin" .
      - run: '"$RUNNER_TEMP/gitleaks-bin" git --redact --exit-code 1'
      - run: python scripts/check_repository.py
